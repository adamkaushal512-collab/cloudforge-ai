[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudforge-ai"
version = "0.1.0"
description = "CloudForge enterprise AI platform backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "sqlalchemy>=2.0,<3.0",
     "psycopg[binary]>=3.2,<4.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cloudforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
