[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudforge-ai"
version = "0.1.0"
description = "CloudForge enterprise AI platform backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "sqlalchemy>=2.0,<3.0",
     "psycopg[binary]>=3.2,<4.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cloudforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers"]
markers = [
    "unit: isolated logic tests; no database, no HTTP app",
    "api: HTTP tests through the FastAPI TestClient",
    "integration: tests that require PostgreSQL (TEST_DATABASE_URL)",
]

[tool.coverage.run]
source = ["cloudforge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.html]
directory = "htmlcov"
